P('accueil','Accueil','main',`## Notre vision\nÀ l’école Don Bosco, nous croyons que chaque enfant mérite une **éducation de qualité** qui favorise l’acquisition de connaissances, mais aussi le développement personnel. Notre vision est de créer un environnement stimulant où les élèves peuvent s’épanouir et se forger un avenir prometteur.\n\nL’école est **sous contrat d’association avec l’État** et accueille des enfants de la maternelle au CM2, dans le centre de Saint-Just-Malmont, à proximité des infrastructures sportives de la commune.\n\n## Inscriptions sur rendez-vous\nVous avez un enfant né en 2023, 2024 ou 2025 ? Vous emménagez à Saint-Just-Malmont ? La rentrée se prépare déjà ! Contactez-nous par mail ou par téléphone pour en savoir plus et vous assurer une place.\n\n## Nos valeurs\n- **Bienveillance et respect** : au cœur de notre communauté scolaire.\n- **Innovation pédagogique** : des méthodes adaptées aux besoins de chaque élève.\n- **Partenariat éducatif** : nous collaborons étroitement avec les parents. Un accompagnement individualisé peut être mis en place avec le réseau d’aide Haute-Loire.\n\n## Nos programmes\n- **Bases solides** : lecture, français, mathématiques, sciences, histoire-géographie, anglais.\n- **Activités artistiques et culturelles** : musique, arts plastiques, théâtre, danse pour le spectacle de l’école.\n- **Sport et bien-être** : éducation physique, piscine, tennis de table, sports collectifs.\n- **Ateliers et projets** : projets interdisciplinaires, travail en petits groupes.\n\n## Notre engagement\nNous préparons nos élèves à devenir des citoyens responsables et épanouis, avec une approche bienveillante et une volonté constante d’innover. Nous invitons toutes les familles à visiter l’école.\n\n## Ces associations interviennent auprès de nos élèves\n- [Tennis de table](https://www.ttstjustmalmont.fr/)\n- [Tennis club](https://tenup.fft.fr/club/50430257?utm_source=gmb)\n- [Timothé petit cœur](https://www.timothepetitcoeur.com/)\n- Ciné ruban`),
P('ogec','L’OGEC','asso',`![Logo OGEC](https://www.ecole-donbosco.fr/web3/images/MTORTOZA/logo_ogec_2025_Petit_Personnalisé.PNG)\n\n**L’OGEC est l’Organisme de Gestion de l’Enseignement Catholique.**\n\nL’OGEC de l’école Don Bosco est responsable de la **gestion administrative et financière** de l’établissement. Composé de **bénévoles et de professionnels engagés**, l’OGEC veille à la bonne marche de l’école et à la qualité des conditions d’apprentissage.\n\n## Les missions de l’OGEC\n- **Gestion financière** : l’OGEC assure la gestion financière de l’école, veillant à l’équilibre budgétaire et à la transparence des comptes.\n- **Entretien et aménagement** : il est responsable de l’entretien des bâtiments et des installations, ainsi que des projets d’aménagement et de rénovation.\n- **Ressources humaines** : il gère le personnel administratif et technique de l’école, en collaboration avec la direction.\n- **Partenariats et subventions** : il recherche des partenariats et des subventions pour financer les projets pédagogiques et les améliorations des infrastructures.\n\nGrâce à l’engagement de l’OGEC, l’école Don Bosco peut offrir un **environnement d’apprentissage sécurisé et de qualité**. Nous remercions chaleureusement les membres de l’OGEC pour leur dévouement et leur contribution indispensable à notre communauté scolaire.\n\nContact national : [F.N.O.G.E.C.](http://www.fnogec.org/)`),
P('apel','L’APEL','asso',`![APEL](https://www.ecole-donbosco.fr/web3/images/cache/176811cf3dcd330a7e4b684c0ee12a1b_w262.jpg)\n\n**L’Association des Parents d’élèves de l’Enseignement Libre.**\n\nL’APEL de l’école Don Bosco joue un rôle essentiel dans la vie de notre communauté scolaire. Composée de **parents bénévoles engagés**, elle travaille en partenariat étroit avec l’équipe éducative pour enrichir l’expérience scolaire de nos élèves.\n\n## Les missions de l’APEL\n- **Représentation des parents** : l’APEL représente les parents auprès des instances de l’école et participe activement aux conseils d’école.\n- **Soutien aux projets éducatifs** : l’association finance et organise des activités pédagogiques, culturelles et sportives pour les élèves.\n- **Animation de la vie scolaire** : l’APEL organise des événements conviviaux tels que la fête de l’école, les soirées et des ventes, renforçant le lien entre les familles et l’école.\n\nGrâce à l’engagement et à la bienveillance de ses membres, notre école bénéficie d’un **environnement collaboratif et dynamique**. Nous invitons tous les parents à s’impliquer et à participer aux activités de l’association, et remercions chaleureusement les parents bénévoles.\n\n## Famille & éducation\nLe magazine de la scolarité et de l’éducation est diffusé tous les deux mois : informations pratiques, conseils, témoignages et pistes de réflexion sur l’éducation de votre enfant. Pour le recevoir, il suffit d’être adhérent au mouvement national en payant la cotisation proposée en début d’année scolaire.\n\nCette adhésion donne aussi accès à deux services :\n- **APEL Service : 0 810 255 255**, au prix d’un appel local. Des spécialistes (conseillers scolaires, psychologues, juristes…) répondent à vos questions sur la scolarité, l’orientation, les problèmes juridiques ou psychologiques.\n- **Un numéro régional : 04 73 91 44 51**, service d’information et de conseil aux familles : accueil personnalisé et gratuit sur les études et les professions, ainsi que sur les difficultés rencontrées par les enfants (problèmes scolaires, handicap, adolescence…).\n\n**Vous aussi, rejoignez l’équipe APEL !**\n\nContact : [apel@ecole-donbosco.fr](mailto:apel@ecole-donbosco.fr) · Contact national : [apel.fr](https://www.apel.fr/)`),
P('bosco','Qui est Don Bosco ?','ecole','Saint Jean Bosco, ou Don Bosco, est né le 16 août 1815 à Castelnuovo d’Asti (royaume de Sardaigne) et mort le 31 janvier 1888 à Turin. Prêtre italien, il a voué sa vie à l’éducation des jeunes issus de milieux défavorisés et fondé en 1854 la Société de Saint François de Sales, plus connue sous le nom de congrégation des salésiens.\n\nL’Église catholique l’a déclaré saint en 1934. Il est fêté le 31 janvier. C’est le saint patron des imprimeurs, des apprentis et des prestidigitateurs.\n\n## Ses valeurs pédagogiques\n- **L’affection** : « Que non seulement les jeunes soient aimés, mais qu’ils se sachent aimés. »\n- **L’espérance** : « Chaque jeune est appelé à être heureux et à vivre heureux. »\n- **La confiance** : « Je crois en toi, j’ai confiance en tes possibilités. »'),

P('horaires','Les horaires','ecole','## Lundi, mardi, jeudi et vendredi\n- **Matin** : ouverture dès 7h30, garderie de 7h30 à 8h10, cours de 8h25 à 11h40.\n- **Après-midi** : ouverture dès 13h10, cours de 13h20 à 16h20.\n- **Aide personnalisée** en primaire de 16h30 à 17h00, proposée par les enseignantes aux élèves qui en ont besoin.\n- **Garderie** en maternelle, **étude surveillée et aide aux devoirs** en primaire, de 16h30 à 18h00 (voir « Périscolaire »).'),
P('locaux','Les locaux','ecole','L’école dispose d’infrastructures accueillantes et bien aménagées :\n- des salles de classe rénovées et adaptées à chaque âge ;\n- des salles dédiées : BCD, informatique, arts plastiques ;\n- une salle de motricité ;\n- plusieurs espaces de jeux pour les récréations.\n\n[Situer l’école dans le village](https://www.google.fr/maps/place/Rue+du+Midi,+43240+Saint-Just-Malmont)',{gal:true}),
P('equipe','L’équipe éducative','ecole','## Une équipe éducative soudée\nDes concertations et des réunions ont lieu régulièrement pour faire le point sur les réussites, les besoins, les formations et les moyens mis en place pour les projets pédagogiques. L’équipe est composée de professionnels rigoureux, passionnés, engagés auprès des enfants et à l’écoute des parents. Des rendez-vous sont proposés dans l’année pour faire le point avec les familles.\n\n## 3 ATSEM\nAide matérielle à la préparation et à l’encadrement des activités, hygiène et sécurité des locaux, accueil, surveillance, sieste.\n\n## Un dispositif d’aide (école inclusive)\n- **1 enseignant référent**, interlocuteur privilégié des familles.\n- **1 enseignant ERR** (Enseignant Ressource Réseau) pour les élèves en difficultés d’apprentissage lourdes et persistantes.\n- **1 AESH** (Accompagnement des Élèves en Situation de Handicap).',{team:true}),
P('projets','Les projets','ecole','## La fête des 100 jours d’école\nLes élèves ont donné 100 raisons pour lesquelles ils aiment leur école.\n\n## Deux livres pour enfants et un jeu de société\nRéalisation complète, de la création à l’édition, de deux livres pour enfants et d’un jeu de société sur notre commune.'),
P('financier','Règlement financier','main','## Règlement financier 2025-2026\n**Contribution des familles** : 21 € par mois et par enfant. Une remise de 50 % s’applique pour le troisième enfant scolarisé dans l’établissement.\n\nUne participation de 4 € par mois et par enfant permet de régler les fournitures (cahiers, livrets de maths et de français, livrets de leçons, matériel de bricolage, cadeaux de Noël, fête des parents…).\n\n## Périscolaire dans les locaux de l’école\nGarderie (maternelle) ou étude surveillée (CP au CM2), dès 7h30 le matin et jusqu’à 18h00 le soir.\n- Forfait matin **ou** soir : 18 € par mois et par enfant.\n- Forfait matin **et** soir : 25 € par mois et par enfant.\n\nLes factures sont réglées tous les deux mois.'),

P('mentions','Mentions légales','foot',`## Éditeur du site\nÉcole Don Bosco, établissement catholique sous contrat d’association avec l’État.\n1, Rue du Midi, 43240 Saint-Just-Malmont · Tél : 04 77 35 60 74 · E-mail : stjust@ecole-donbosco.fr\nDirection de la publication : la direction de l’école.\n\n## Réalisation et maintenance\nSite propulsé par [EbWebs.org](https://ebwebs.org).\n\n## Hébergement\nÀ compléter selon l’hébergeur retenu (par exemple Google Firebase Hosting).\n\n## Données personnelles\nCe site ne collecte aucune donnée nominative auprès des visiteurs. Des statistiques de fréquentation anonymes (pages consultées, nombre de visites) sont enregistrées pour améliorer le site. Les e-mails ou appels adressés à l’école ne sont utilisés que pour répondre aux demandes.\nPour toute question ou demande d’accès, de rectification ou de suppression, contactez l’école par e-mail.\n\n## Cookies et stockage local\nLe site enregistre uniquement, dans votre navigateur, votre préférence pour le décor saisonnier. Aucun cookie publicitaire n’est utilisé.\n\n## Propriété intellectuelle\nLes textes, logos et photographies de ce site appartiennent à l’école Don Bosco ou à leurs auteurs et ne peuvent être réutilisés sans autorisation.\n\n*Texte type, à faire valider par la direction.*`)],

function addD(){const d=$('#dd').value,t=$('#dt').value.trim();if(d&&t){cfg.dates.push({d,t});save();draw()}}
function addP(){const t=prompt('Titre de la nouvelle page ?');if(!t)return;const id=t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'page';cfg.pages.push({id:id+'-'+Date.now().toString(36),t,g:'main',b:'Contenu à rédiger.'});pi=cfg.pages.length-1;save();draw()}
async function addU(){const u=$('#nu').value.trim().toLowerCase(),p=$('#np').value,n=$('#nn').value.trim();if(!u||!n||p.length<4||cfg.users.find(x=>x.u===u))return alert('Nom, identifiant libre et mot de passe de 4 caractères minimum.');cfg.users.push({u,name:n,p:await H(p),r:$('#nr').value,d:0,m:''});save();draw()}
async function setP(i){const p=$('#pw'+i).value;if(p.length<4)return alert('4 caractères minimum');cfg.users[i].p=await H(p);cfg.users[i].d=1;save();msg='Mot de passe changé.';draw()}
async function myP(){const p=$('#mp').value;if(p.length<4)return alert('4 caractères minimum');me.p=await H(p);me.d=0;save();msg='Mot de passe changé.';draw()}
function sp(k,v){const p=pref();p[k]=v;try{localStorage.setItem('pref:'+me.u,JSON.stringify(p))}catch(e){}theme()}
async function dl(){const html=buildSite(cfg);mt('export');if(!await sv('vitrine.html',html)){out=html;draw()}}
function lfx(){const e=$('#lfx');if(!e||cfg.loginFx==='none')return;const s=cfg.loginFx==='snow';for(let i=0;i<(s?60:90);i++){const d=document.createElement('i');d.style.left=Math.random()*100+'%';d.style.animationDuration=(s?5+Math.random()*6:.6+Math.random()*.6)+'s';d.style.animationDelay=-Math.random()*8+'s';d.style.opacity=.3+Math.random()*.6;e.appendChild(d)}}
const FK=['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId'];
function fbcGet(){let o={};try{o=JSON.parse(localStorage.getItem('fbcfg'))||{}}catch(e){}return window.FB_CONFIG&&window.FB_CONFIG.apiKey?window.FB_CONFIG:o}
const fbcText=()=>{const o=fbcGet();return FK.filter(k=>o[k]).map(k=>k+": '"+o[k]+"'").join(',\n')};
const fbcParse=t=>{const o={};FK.forEach(k=>{const m=t.match(new RegExp(k+'["\']?\\s*:\\s*["\']([^"\']+)["\']'));if(m)o[k]=m[1]});return o};
async function fbSave(){const o=fbcParse($('#fbc').value);if(!o.apiKey||!o.projectId)return alert('apiKey et projectId sont nécessaires.');try{localStorage.setItem('fbcfg',JSON.stringify(o))}catch(e){}window.FB_CONFIG=o;await fbInit();msg=FB?'Connecté à Firebase.':'Connexion impossible (réseau ou configuration).';draw()}
async function sv(name,data){try{const d=window.claude&&await window.claude.use('downloads');if(d){await d.save({filename:name,data});return true}}catch(e){}try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/plain'}));a.download=name;document.body.appendChild(a);a.click();a.remove();return true}catch(e){return false}}
async function fbFile(){const o=fbcParse($('#fbc').value);if(!o.apiKey)return alert('Collez d’abord la configuration.');if(!await sv('firebase-config.js','window.FB_CONFIG = '+JSON.stringify(o,null,2)+';\n')){out='window.FB_CONFIG = '+JSON.stringify(o)+';';tab='apr';draw()}}
async function fbTest(){if(!FB){msg='Pas de connexion Firebase active.';return draw()}try{await FB.f.getDoc(FB.f.doc(FB.db,'site','config'));msg='Base joignable.'}catch(e){msg='Échec : '+e.message}draw()}
function mt(a){try{if(FB&&me){const d=new Date().toISOString().slice(0,10);FB.f.setDoc(FB.f.doc(FB.db,'mstats',d),{day:d,mgr:{[a]:FB.f.increment(1)}},{merge:true})}}catch(e){}try{const s=JSON.parse(localStorage.getItem('mstat'))||{};s[a]=(s[a]||0)+1;localStorage.setItem('mstat',JSON.stringify(s))}catch(e){}}
let ST=null,sd=7;
async function stLoad(){ST=[];if(FB){try{const f=FB.f,g=async c=>(await f.getDocs(f.query(f.collection(FB.db,c),f.orderBy('day','desc'),f.limit(30)))).docs.map(d=>d.data()),a=await g('stats'),b=await g('mstats'),m={};b.forEach(x=>m[x.day]=x.mgr);a.forEach(x=>x.mgr=m[x.day]);b.forEach(x=>{if(!a.find(y=>y.day===x.day))a.push({day:x.day,mgr:x.mgr})});ST=a.sort((p,q)=>p.day>q.day?1:-1)}catch(e){msg='Statistiques indisponibles : '+e.message}}draw()}
function statsHTML(){const D=ST.slice(-sd),sum=f=>D.reduce((a,d)=>a+f(d),0),V=sum(d=>d.views||0),U=sum(d=>d.visitors||0),C=sum(d=>d.clicks||0);
const agg=k=>{const o={};D.forEach(d=>Object.entries(d[k]||{}).forEach(([a,b])=>o[a]=(o[a]||0)+b));return Object.entries(o).sort((a,b)=>b[1]-a[1])};
const bars=r=>r.map(x=>`<div class="sb"><span>${esc(String(x[0]).replace(/_/g,' '))}</span><i style="width:${Math.max(3,x[1]/r[0][1]*60)}%"></i><b>${x[1]}</b></div>`).join('')||'<p style="color:var(--mu)">Aucune donnée.</p>';
const tt=id=>(cfg.pages.find(p=>p.id===id)||{t:{actus:'Actualités',liens:'Liens',contact:'Contact'}[id]||id}).t;
let lm=[];try{lm=Object.entries(JSON.parse(localStorage.getItem('mstat'))||{})}catch(e){}
const mxd=Math.max(1,...D.map(d=>d.views||0));
return `${FB?'':'<div class="warn">Les statistiques des visiteurs nécessitent une base Firebase connectée (onglet Firebase et outils). L’activité ci-dessous vient de ce navigateur uniquement.</div>'}<div class="row" style="margin-bottom:12px"><select onchange="sd=+this.value;draw()" style="width:auto"><option value="7" ${sd===7?'selected':''}>7 derniers jours</option><option value="30" ${sd===30?'selected':''}>30 derniers jours</option></select><button class="g" onclick="ST=null;draw()">Actualiser</button></div>
<div class="two"><div class="cd"><small>Pages vues</small><h2 style="margin:0">${V}</h2></div><div class="cd"><small>Visiteurs uniques (cumul par jour)</small><h2 style="margin:0">${U}</h2></div><div class="cd"><small>Interactions (clics)</small><h2 style="margin:0">${C}</h2></div></div>
<div class="cd"><h3>Pages vues par jour</h3><div class="col">${D.map(d=>`<div title="${d.day}"><i style="height:${Math.max(2,(d.views||0)/mxd*110)}px"></i><small>${(d.day||'').slice(8)}</small></div>`).join('')||'<p style="color:var(--mu)">Aucune donnée.</p>'}</div></div>
<div class="two"><div class="cd"><h3>Pages les plus vues</h3>${bars(agg('pages').map(r=>[tt(r[0]),r[1]]))}</div><div class="cd"><h3>Types d’interactions</h3>${bars(agg('ev'))}</div></div><div class="cd"><h3>Activité de l’équipe (manager)</h3>${bars(FB?agg('mgr'):lm)}</div>`}

async function walk(o,fn){if(typeof o==='string')return fn(o);if(Array.isArray(o))return Promise.all(o.map(v=>walk(v,fn)));if(o&&typeof o==='object'){const r={};for(const k in o)r[k]=await walk(o[k],fn);return r}return o}
async function fbPush(){try{const f=FB.f,{users,...pub}=cfg;const j=await walk(pub,async v=>{if(!v.startsWith('data:image'))return v;const id=await H(v);await f.setDoc(f.doc(FB.db,'media',id),{d:v});return 'media:'+id});await f.setDoc(f.doc(FB.db,'site','config'),{json:JSON.stringify(j),at:Date.now(),by:me.u});await f.setDoc(f.doc(FB.db,'site','private'),{json:JSON.stringify(users)});msg='Site publié sur Firebase.';mt('publication')}catch(e){msg='Échec Firebase : '+e.message}draw()}
async function fbPull(){try{const f=FB.f,a=await f.getDoc(f.doc(FB.db,'site','config')),b=await f.getDoc(f.doc(FB.db,'site','private'));if(!a.exists())throw new Error('Rien à récupérer');const j=await walk(JSON.parse(a.data().json),async v=>{if(!v.startsWith('media:'))return v;const d=await f.getDoc(f.doc(FB.db,'media',v.slice(6)));return d.exists()?d.data().d:''});cfg={...j,users:b.exists()?JSON.parse(b.data().json):cfg.users};save();msg='Données récupérées.'}catch(e){msg='Échec Firebase : '+e.message}draw()}
init();
</script></body></html>
